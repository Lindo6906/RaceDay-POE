version: "3.9"

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "RaceDay!StrongPass123"
    ports: ["14333:1433"]
    volumes: ["sqldata:/var/opt/mssql"]

  api:
    build:
      context: .
      dockerfile: RaceDay.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=RaceDayDb;User Id=sa;Password=RaceDay!StrongPass123;TrustServerCertificate=True;MultipleActiveResultSets=true"
    depends_on: [sql]
    ports: ["5101:8080"]

  web:
    build:
      context: .
      dockerfile: RaceDay.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ApiSettings__BaseUrl: "http://api:8080/"
    depends_on: [api]
    ports: ["5102:8080"]

volumes:
  sqldata: