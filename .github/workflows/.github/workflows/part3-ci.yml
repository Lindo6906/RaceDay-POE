name: Part 3 CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore RaceDay.sln
      - name: Build
        run: dotnet build RaceDay.sln --no-restore -c Release
      - name: Test
        run: dotnet test RaceDay.sln --no-build -c Release

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f RaceDay.Api/Dockerfile .
      - name: Build Web image
        run: docker build -f RaceDay.Web/Dockerfile .
